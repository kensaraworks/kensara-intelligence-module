name: Deploy Frontend (GitHub Pages)

# Publishes the static web/ folder to GitHub Pages.
#  • on every human push that touches web/  (instant)
#  • daily at 01:00 UTC as a safety net that redeploys the latest committed
#    snapshot (cron snapshot commits are made with GITHUB_TOKEN, which by design
#    does NOT trigger other workflows — the schedule + live-refresh cover that)
#  • manually via "Run workflow"
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
