name: Weekly Competitor Intelligence

on:
  schedule:
    - cron: '30 0 * * 1'   # Mon 00:30 UTC (06:00 IST)
  workflow_dispatch:

concurrency:
  group: pipeline-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  competitor-crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run competitor crawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.main competitor

      - name: Generate content angles (#9) + weekly brief (#6)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m src.main angles
          python -m src.main brief

      - name: Commit brief + angles
        uses: ./.github/actions/commit-snapshot
        with:
          message: "chore: weekly brief + content angles"
